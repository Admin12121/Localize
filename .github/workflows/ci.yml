name: CI
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:repo
      - run: npm run build
      - run: npm run validate
      - run: npm test
      - run: python -m pip install pytest build uv -r requirements/integrations.txt -r requirements/agent.txt
      - run: python -m build --wheel --outdir dist/release
      - run: python -m pytest -q tests/python --durations=15
      - run: python -m pip install --no-deps dist/release/localizeit-3.2.4-py3-none-any.whl
      - run: localize --about
      - run: localizeit --about
      - run: web-bridge --about
      - run: python scripts/package-release.py
