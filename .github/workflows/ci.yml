name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run validate
      - run: npm test
      - run: python -m pip install pytest -r requirements/integrations.txt -r requirements/agent.txt
      - run: python -m pytest -q tests/python
      - run: python scripts/package-release.py
