[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localizeit"
version = "3.2.1"
description = "Locally controlled project and CTF tools through a private MCP bridge"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["optional-dependencies"]

[project.scripts]
localize = "web_bridge.setup.launcher:main"
localizeit = "web_bridge.setup.launcher:main"
web-bridge = "web_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
web_bridge = ["*.json", "ui/*.html", "ui/*.css", "ui/*.svg", "ui/*.js", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/python"]

[tool.setuptools.dynamic.optional-dependencies]
integrations = {file = ["requirements/integrations.txt"]}
agent = {file = ["requirements/agent.txt"]}
